<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Define la codificación para soportar tildes y caracteres especiales. -->
    <meta charset="UTF-8">
    <!-- Hace que la interfaz sea adaptable a pantallas pequeñas. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparecerá en la pestaña del navegador. -->
    <title>PSQL Web Emulator - Jehidy Villalba</title>
    <!-- Hoja de estilos embebida (unificada con el HTML). -->
    <style>
/* =========================================================
   PSQL WEB EMULATOR - HOJA DE ESTILOS
   Interfaz inspirada en Windows Terminal / psql.
   ========================================================= */

/* Variables de color reutilizables en toda la aplicación. */
:root {
    --bg: #111111;
    --panel: #171717;
    --panel-2: #202020;
    --border: #3a3a3a;
    --text: #dddddd;
    --muted: #999999;
    --green: #7ee787;
    --blue: #58a6ff;
    --yellow: #e3b341;
    --red: #ff7b72;
}

/* Hace que el tamaño de los elementos sea más fácil de controlar. */
* {
    box-sizing: border-box;
}

/* Configuración general de la página. */
body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Consolas, "Courier New", monospace;
    height: 100vh;
    overflow: hidden;
}

/* Contenedor general. */
.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Barra superior. */
.topbar {
    min-height: 70px;
    background: #1b1b1b;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
}

/* Título principal. */
.topbar h1 {
    margin: 0;
    font-size: 19px;
    color: #f0f0f0;
}

/* Subtítulo. */
.topbar span {
    color: var(--muted);
    font-size: 12px;
}

/* Grupo de botones. */
.top-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

/* Botones generales. */
button {
    border: 1px solid var(--border);
    background: #252525;
    color: var(--text);
    border-radius: 5px;
    padding: 8px 12px;
    cursor: pointer;
    font-family: inherit;
}

/* Efecto visual al pasar el mouse. */
button:hover {
    background: #303030;
}

/* Botón de ejecución destacado. */
#runButton {
    border-color: var(--green);
    color: var(--green);
}

/* Barra de estado. */
.statusbar {
    min-height: 34px;
    background: #0c0c0c;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 0 18px;
    font-size: 12px;
    color: var(--muted);
}

/* Valores importantes de la sesión. */
.statusbar strong {
    color: var(--green);
}

/* Área central. */
.workspace {
    flex: 1;
    min-height: 0;
    display: flex;
    position: relative;
}

/* Panel de terminal. */
.terminal-panel {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: #0b0b0b;
}

/* Salida de la terminal. */
.terminal-output {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
    line-height: 1.5;
}

/* Una línea de historial. */
.terminal-line {
    margin-bottom: 8px;
}

/* Tablas de resultados dentro de la terminal. */
.terminal-output table {
    border-collapse: collapse;
    margin: 6px 0 14px;
    font-size: 13px;
}

.terminal-output th,
.terminal-output td {
    border: 1px solid var(--border);
    padding: 4px 10px;
    text-align: left;
}

.terminal-output th {
    background: #1c1c1c;
    color: var(--blue);
}

/* Prompt mostrado en verde. */
.prompt {
    color: var(--green);
    white-space: nowrap;
    padding-top: 4px;
}

/* Entrada del usuario. */
.input-row {
    display: flex;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #242424;
    background: #0b0b0b;
}

/* Campo de comandos. */
#commandInput {
    flex: 1;
    resize: none;
    border: 0;
    outline: 0;
    background: transparent;
    color: #eeeeee;
    font: inherit;
    line-height: 1.5;
    min-height: 24px;
    max-height: 140px;
    overflow-y: auto;
}

/* Colores de diferentes tipos de salida. */
.output-success { color: var(--blue); }
.output-error { color: var(--red); }
.output-info { color: var(--yellow); }
.output-normal { color: var(--text); }

/* Panel lateral. */
.help-panel {
    width: 380px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 14px;
}

/* Oculta elementos (panel de ayuda al inicio). */
.hidden {
    display: none !important;
}

/* Cabecera del panel de ayuda. */
.help-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
}

/* Título de ayuda. */
.help-header h2 {
    margin: 0 0 10px;
    font-size: 16px;
}

/* Botón X. */
#closeHelp {
    padding: 3px 9px;
    font-size: 18px;
}

/* Categorías de ayuda. */
.help-category {
    margin-bottom: 16px;
}

/* Título de cada categoría. */
.help-category h3 {
    color: var(--blue);
    margin: 0 0 7px;
    font-size: 13px;
}

/* Texto explicativo (panel Explicaciones). */
.help-category p {
    margin: 0 0 6px;
    font-size: 12px;
    color: var(--text);
    line-height: 1.5;
}

/* Cada comando del panel. */
.help-command {
    margin: 5px 0;
    font-size: 12px;
}

/* Código del comando. */
.help-command code {
    color: var(--green);
}

/* Descripción del comando. */
.help-command span {
    color: var(--muted);
}

/* Pie de página. */
footer {
    min-height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #161616;
    border-top: 1px solid var(--border);
    color: #777;
    font-size: 11px;
}

/* Adaptación para pantallas pequeñas. */
@media (max-width: 850px) {
    .help-panel {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: min(380px, 92vw);
        z-index: 10;
        box-shadow: -10px 0 30px #000;
    }

    .statusbar {
        gap: 10px;
        overflow-x: auto;
    }
}
    </style>
</head>
<body>
    <!-- Contenedor principal de toda la aplicación. -->
    <main class="app">
        <!-- Barra superior con título y controles. -->
        <header class="topbar">
            <div>
                <!-- Nombre de la aplicación. -->
                <h1>PSQL Web Emulator</h1>
                <!-- Texto identificativo del proyecto. -->
                <span>PostgreSQL simulado para examen final de base de datos 2</span>
            </div>
        </header>

        <!-- Información de la sesión actual. -->
        <section class="statusbar">
            <span>Usuario: <strong id="currentUser">postgres</strong></span>
            <span>Base de datos: <strong id="currentDatabase">postgres</strong></span>
            <span>Rol: <strong id="currentRole">SUPERUSER</strong></span>
        </section>

        <!-- Área que contiene terminal y ayuda lateral. -->
        <section class="workspace">
            <!-- Terminal principal. -->
            <section class="terminal-panel">
                <!-- Salida de comandos. JavaScript agrega aquí los resultados. -->
                <div id="terminalOutput" class="terminal-output"></div>

                <!-- Línea de entrada estilo psql. -->
                <div class="input-row">
                    <!-- Prompt dinámico según usuario y base actual. -->
                    <span id="prompt" class="prompt"></span>
                    <!-- Campo donde el usuario escribe comandos SQL/psql. -->
                    <textarea id="commandInput" rows="1" spellcheck="false"
                        autocomplete="off" autofocus placeholder="Escriba un comando..."></textarea>
                    <!-- Botones de acción, alineados a la derecha del campo de comando. -->
                    <div class="top-actions">
                        <!-- Ejecuta el comando escrito (RF-03: además de Enter). -->
                        <button id="runButton">Ejecutar</button>
                        <!-- Muestra/oculta el panel de ayuda. -->
                        <button id="helpButton">Ayuda</button>
                        <!-- Muestra el panel de teoría/explicaciones (RF-12). -->
                        <button id="explainButton">Explicaciones</button>
                        <!-- Limpia visualmente la terminal. -->
                        <button id="clearButton">Limpiar</button>
                        <!-- Reinicia toda la sesión simulada. -->
                        <button id="resetButton">Reiniciar</button>
                    </div>
                </div>
            </section>

            <!-- Panel lateral de ayuda / explicaciones (comparten el mismo panel). -->
            <aside id="helpPanel" class="help-panel hidden">
                <div class="help-header">
                    <h2 id="helpTitle">Ayuda rápida</h2>
                    <!-- Cierra el panel lateral. -->
                    <button id="closeHelp">×</button>
                </div>
                <!-- JavaScript genera el contenido de ayuda o de explicaciones. -->
                <div id="helpContent"></div>
            </aside>
        </section>

        <!-- Pie de página con autoría. -->
        <footer>
            Diseñado por Ariel Lesmo · Proyecto académico · usando Claude.ai
        </footer>
    </main>

    <!-- ================================================================
         MOTOR DE DATOS SIMULADO (antes database.js)
         Estado completo del emulador en memoria RAM.
         No usamos localStorage: F5/Ctrl+F5 vuelve al estado inicial (RF-15).
         ================================================================ -->
    <script>
const VERSION="PostgreSQL 16.4 (Emulador PSQL educativo)";
function initialState(){return{
 currentDatabase:"postgres",loginRole:"postgres",sessionRole:"postgres",
 databases:{postgres:{owner:"postgres",tables:{},encoding:"UTF8"}},
 roles:{postgres:{login:true,superuser:true,password:null,members:[],
 privileges:{databases:["CONNECT"],schemas:["USAGE","CREATE"],tables:{}}}}
};}
let DB=initialState();

/* hasPrivilege(): punto central de control de permisos (RF-07). */
function hasPrivilege(role,priv,type,obj){
 const r=DB.roles[role]; if(!r)return false;
 if(r.superuser)return true;
 const candidates=[role,...(r.members||[])];
 return candidates.some(n=>{
  const x=DB.roles[n];if(!x)return false;
  if(type==="database")return x.privileges.databases.includes(priv);
  if(type==="schema")return x.privileges.schemas.includes(priv);
  if(type==="table")return (x.privileges.tables[obj]||[]).includes(priv);
  return false;
 });
}
function grantP(role,priv,type,obj){const r=DB.roles[role];if(!r)return;
 if(type==="database"&&!r.privileges.databases.includes(priv))r.privileges.databases.push(priv);
 if(type==="schema"&&!r.privileges.schemas.includes(priv))r.privileges.schemas.push(priv);
 if(type==="table"){r.privileges.tables[obj]??=[];if(!r.privileges.tables[obj].includes(priv))r.privileges.tables[obj].push(priv);}
}
function revokeP(role,priv,type,obj){const r=DB.roles[role];if(!r)return;
 if(type==="database")r.privileges.databases=r.privileges.databases.filter(x=>x!==priv);
 if(type==="schema")r.privileges.schemas=r.privileges.schemas.filter(x=>x!==priv);
 if(type==="table"&&r.privileges.tables[obj])r.privileges.tables[obj]=r.privileges.tables[obj].filter(x=>x!==priv);
}
    </script>

    <!-- ================================================================
         INTÉRPRETE DE COMANDOS (antes commands.js)
         Reconoce los comandos exigidos por RF-04..RF-10, con validaciones
         de dependencias al eliminar roles/usuarios y el comando whoami.
         ================================================================ -->
    <script>
const ok=t=>({type:"success",text:t}),err=t=>({type:"error",text:"ERROR: "+t});
const norm=s=>s.trim().replace(/\s+/g," ");
function parts(s){let a=[],st=0,d=0,q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==="'"&&s[i-1]!=="\\")q=!q;if(!q){if(c==="(")d++;if(c===")")d--;if(c===","&&d===0){a.push(s.slice(st,i).trim());st=i+1}}}a.push(s.slice(st).trim());return a.filter(Boolean)}
function need(p,t,o){return hasPrivilege(DB.sessionRole,p,t,o)?null:err(`permiso denegado: ${DB.sessionRole} no tiene ${p} sobre ${t} ${o} [42501]`)}

/* Resuelve una referencia de tabla admitiendo "schema.tabla" o "tabla" a secas (por defecto, schema "public"). */
function resolveTableRef(ref){
 const m=ref.match(/^(\w+)\.(\w+)$/);
 if(m)return{schema:m[1],name:m[2]};
 return{schema:"public",name:ref};
}
/* Separa "TIPO [NOT NULL]" (tal cual se guarda en cada columna) para mostrar Type y Nullable por separado en \d. */
function splitColumnType(def){
 const notNull=/not\s+null/i.test(def);
 const type=def.replace(/not\s+null/i,"").trim();
 return{type,notNull};
}

function executeCommand(raw){
 const s=norm(raw);if(!s)return null;
 if(/^\\q$|^quit$|^exit$|^salir$/i.test(s)){DB=initialState();return ok("Sesión finalizada. Estado restaurado al estado base.")}
 if(/^clear$|^cls$|^\\clear$/i.test(s))return{type:"clear"};
 if(/^whoami;?$/i.test(s))return whoami();
 if(/^\\l$|^\\list$/i.test(s))return table(["Name","Owner","Encoding"],Object.entries(DB.databases).map(([n,d])=>[n,d.owner,d.encoding||"UTF8"]),"List of databases");
 if(/^\\du$/i.test(s)||/^select \* from pg_roles;$/i.test(s))return roles();
 if(/^\\dt$/i.test(s)){let d=DB.databases[DB.currentDatabase];return table(["Schema","Name","Type","Owner"],Object.entries(d.tables).map(([n,t])=>[t.schema||"public",n,t.type||"table",t.owner||d.owner]),"List of relations")}
 let m=s.match(/^\\d\s+([\w.]+)$/i);if(m)return describe(m[1]);
 m=s.match(/^\\(?:c|connect)\s+(\w+)$/i);if(m)return connect(m[1]);
 if(/^select version\(\);?$/i.test(s))return table(["version"],[[VERSION]]);

 m=s.match(/^create database (\w+);$/i);if(m)return createDB(m[1]);
 m=s.match(/^create table (\w+)\s*\((.+)\);$/i);if(m)return createTable(m[1],m[2]);
 m=s.match(/^create role (\w+) nologin;$/i);if(m)return createRole(m[1],false,null);
 m=s.match(/^create user (\w+) with password '([^']*)';$/i);if(m)return createRole(m[1],true,m[2]);
 m=s.match(/^drop (user|role) (\w+);$/i);if(m)return dropRole(m[2],m[1]);

 m=s.match(/^grant (\w+) to (\w+);$/i);if(m)return grantRole(m[1],m[2]);
 m=s.match(/^revoke (\w+) from (\w+);$/i);if(m)return revokeRole(m[1],m[2]);
 m=s.match(/^grant (.+?) on database (\w+) to (\w+);$/i);if(m)return grantObj(m[1],"database",m[2],m[3]);
 m=s.match(/^grant (.+?) on schema (\w+) to (\w+);$/i);if(m)return grantObj(m[1],"schema",m[2],m[3]);
 m=s.match(/^grant (.+?) on all tables in schema \w+ to (\w+);$/i);if(m)return grantAll(m[1],m[2]);
 m=s.match(/^grant (.+?) on (\w+) to (\w+);$/i);if(m)return grantObj(m[1],"table",m[2],m[3]);
 m=s.match(/^revoke (.+?) on database (\w+) from (\w+);$/i);if(m)return revokeObj(m[1],"database",m[2],m[3]);
 m=s.match(/^revoke (.+?) on schema (\w+) from (\w+);$/i);if(m)return revokeObj(m[1],"schema",m[2],m[3]);
 m=s.match(/^revoke (.+?) on all tables in schema \w+ from (\w+);$/i);if(m)return revokeAll(m[1],m[2]);
 m=s.match(/^revoke (.+?) on (\w+) from (\w+);$/i);if(m)return revokeObj(m[1],"table",m[2],m[3]);

 m=s.match(/^set role (\w+);$/i);if(m)return setRole(m[1]);
 if(/^reset role;$/i.test(s))return resetRole();

 m=s.match(/^insert into ([\w.]+)\s*(?:\(([^)]*)\))?\s*values\s*\((.+)\);$/i);if(m)return insert(m[1],m[2],m[3]);
 m=s.match(/^select \* from ([\w.]+);$/i);if(m)return select(m[1]);
 m=s.match(/^update ([\w.]+) set (.+?)(?: where (.+?))?;$/i);if(m)return update(m[1],m[2],m[3]);
 m=s.match(/^delete from ([\w.]+)(?: where (.+?))?;$/i);if(m)return del(m[1],m[2]);
 m=s.match(/^backup database (\w+);$/i);if(m)return backup(m[1]);
 return err("sintaxis no reconocida. Pulse Ayuda.");
}
function table(headers,rows,title){return{type:"table",headers,rows,title}}
function createDB(n){if(DB.databases[n])return err(`base de datos "${n}" ya existe`);DB.databases[n]={owner:DB.sessionRole,tables:{}};return ok(`CREATE DATABASE\nBase "${n}" creada.`)}
function connect(n){if(!DB.databases[n])return err(`base de datos "${n}" no existe`);let p=need("CONNECT","database",n);if(p)return p;DB.currentDatabase=n;return ok(`Conectado a "${n}".`)}
function createTable(n,def){let d=DB.databases[DB.currentDatabase];if(d.tables[n])return err(`la relación "${n}" ya existe`);let p=need("CREATE","schema","public");if(p)return p;let c={};for(let x of parts(def)){let z=x.split(/\s+/);if(z.length<2)return err("definición de columna inválida");c[z[0]]=z.slice(1).join(" ")}d.tables[n]={columns:c,rows:[],schema:"public",owner:DB.sessionRole,type:"table"};return ok(`CREATE TABLE\nTabla "${n}" creada.`)}
function createRole(n,login,pw){if(DB.roles[n])return err(`el rol "${n}" ya existe`);DB.roles[n]={login,superuser:false,password:pw,members:[],privileges:{databases:[],schemas:[],tables:{}}};return ok(`CREATE ROLE\n"${n}" creado${login?"":" con NOLOGIN"}.`)}

/* DROP ROLE / DROP USER con validación de dependencias.
   - No se puede eliminar un rol si otro rol/usuario lo tiene concedido (miembros que dependen de él).
   - No se puede eliminar un usuario/rol si él mismo todavía tiene roles asignados (members no vacío).
   - No se puede eliminar el rol activo de la sesión ni "postgres". */
function dropRole(n,kind){
 if(!DB.roles[n])return err(`rol "${n}" no existe`);
 if(n==="postgres")return err("no se puede eliminar postgres");
 if(DB.sessionRole===n)return err(`no se puede eliminar "${n}" porque es el rol activo de la sesión actual`);
 const dependents=Object.entries(DB.roles).filter(([name,r])=>name!==n&&(r.members||[]).includes(n)).map(([name])=>name);
 if(dependents.length>0)return err(`no se puede eliminar ${kind==="user"?"el usuario":"el rol"} "${n}": está asignado a ${dependents.join(", ")}. Ejecute REVOKE ${n} FROM ${dependents.join(", ")}; antes de eliminarlo [2BP01]`);
 const r=DB.roles[n];
 if((r.members||[]).length>0)return err(`no se puede eliminar ${kind==="user"?"el usuario":"el rol"} "${n}": todavía tiene roles asignados (${r.members.join(", ")}). Ejecute REVOKE ${r.members.join(", ")} FROM ${n}; antes de eliminarlo [2BP01]`);
 delete DB.roles[n];
 return ok(`DROP ${kind.toUpperCase()}\n"${n}" eliminado.`)
}

/* whoami: informa el rol de login y el rol de sesión activo (RF adicional pedido). */
function whoami(){
 const r=DB.roles[DB.sessionRole];
 let txt=`Usuario conectado (login): ${DB.loginRole}\nRol de sesión actual: ${DB.sessionRole}\nSuperusuario: ${r&&r.superuser?"Sí":"No"}`;
 if(DB.sessionRole!==DB.loginRole)txt+=`\n(Use RESET ROLE; para volver a "${DB.loginRole}")`;
 return{type:"info",text:txt}
}

function grantRole(r,u){if(!DB.roles[r]||!DB.roles[u])return err("rol o usuario no existe");if(!DB.roles[u].members.includes(r))DB.roles[u].members.push(r);return ok(`GRANT\nRol "${r}" otorgado a "${u}".`)}
function revokeRole(r,u){if(!DB.roles[r]||!DB.roles[u])return err("rol o usuario no existe");DB.roles[u].members=DB.roles[u].members.filter(x=>x!==r);return ok(`REVOKE\nRol "${r}" revocado de "${u}".`)}
function grantObj(list,type,obj,role){if(!DB.roles[role])return err(`rol "${role}" no existe`);list.split(",").forEach(p=>grantP(role,p.trim().toUpperCase(),type,obj));return ok("GRANT\nPrivilegios otorgados.")}
function revokeObj(list,type,obj,role){if(!DB.roles[role])return err(`rol "${role}" no existe`);list.split(",").forEach(p=>revokeP(role,p.trim().toUpperCase(),type,obj));return ok("REVOKE\nPrivilegios revocados.")}
function grantAll(list,role){if(!DB.roles[role])return err(`rol "${role}" no existe`);for(let t of Object.keys(DB.databases[DB.currentDatabase].tables))list.split(",").forEach(p=>grantP(role,p.trim().toUpperCase(),"table",t));return ok("GRANT\nPrivilegios otorgados sobre todas las tablas.")}
function revokeAll(list,role){if(!DB.roles[role])return err(`rol "${role}" no existe`);for(let t of Object.keys(DB.databases[DB.currentDatabase].tables))list.split(",").forEach(p=>revokeP(role,p.trim().toUpperCase(),"table",t));return ok("REVOKE\nPrivilegios revocados sobre todas las tablas.")}

/* SET ROLE corregido: ahora exige membresía (o superusuario) sin importar si el rol
   destino es LOGIN o NOLOGIN, igual que en PostgreSQL real. Antes solo se validaba
   para roles NOLOGIN, lo que permitía "saltar" a cualquier usuario sin permiso. */
function setRole(n){
 if(!DB.roles[n])return err(`rol "${n}" no existe`);
 const login=DB.roles[DB.loginRole];
 const permitido=n===DB.loginRole||login.superuser||(login.members||[]).includes(n);
 if(!permitido)return err(`permiso denegado para asumir el rol "${n}" [42501]`);
 DB.sessionRole=n;
 return ok(`SET ROLE\nRol actual: "${n}". Use whoami para confirmarlo.`)
}
function resetRole(){DB.sessionRole=DB.loginRole;return ok(`RESET ROLE\nRol restaurado: "${DB.loginRole}".`)}

function insert(ref,cols,vals){const{schema,name:n}=resolveTableRef(ref);if(schema!=="public")return err(`el esquema "${schema}" no existe`);let t=DB.databases[DB.currentDatabase].tables[n];if(!t)return err(`relación "${ref}" no existe`);let p=need("INSERT","table",n);if(p)return p;let c=cols?cols.split(",").map(x=>x.trim()):Object.keys(t.columns),v=parts(vals).map(x=>x.trim().replace(/^'(.*)'$/,"$1"));if(c.length!==v.length)return err("cantidad de columnas y valores no coincide");let r={};c.forEach((x,i)=>r[x]=v[i]);t.rows.push(r);return ok("INSERT 0 1")}
function select(ref){const{schema,name:n}=resolveTableRef(ref);if(schema!=="public")return err(`el esquema "${schema}" no existe`);let t=DB.databases[DB.currentDatabase].tables[n];if(!t)return err(`relación "${ref}" no existe`);let p=need("SELECT","table",n);if(p)return p;let h=Object.keys(t.columns);return table(h,t.rows.map(r=>h.map(c=>r[c]??"NULL")))}
function whereFn(w){if(!w)return()=>true;let m=w.match(/^(\w+)\s*=\s*'?([^']*)'?$/);return m?r=>String(r[m[1]])===m[2]:()=>true}
function update(ref,a,w){const{schema,name:n}=resolveTableRef(ref);if(schema!=="public")return err(`el esquema "${schema}" no existe`);let t=DB.databases[DB.currentDatabase].tables[n];if(!t)return err(`relación "${ref}" no existe`);let p=need("UPDATE","table",n);if(p)return p;let ch={};parts(a).forEach(x=>{let z=x.split("=");ch[z[0].trim()]=z.slice(1).join("=").trim().replace(/^'(.*)'$/,"$1")});let f=whereFn(w),k=0;t.rows.forEach(r=>{if(f(r)){Object.assign(r,ch);k++}});return ok(`UPDATE ${k}`)}
function del(ref,w){const{schema,name:n}=resolveTableRef(ref);if(schema!=="public")return err(`el esquema "${schema}" no existe`);let t=DB.databases[DB.currentDatabase].tables[n];if(!t)return err(`relación "${ref}" no existe`);let p=need("DELETE","table",n);if(p)return p;let f=whereFn(w),b=t.rows.length;t.rows=t.rows.filter(r=>!f(r));return ok(`DELETE ${b-t.rows.length}`)}
function describe(ref){const{schema,name:n}=resolveTableRef(ref);if(schema!=="public")return err(`el esquema "${schema}" no existe`);let t=DB.databases[DB.currentDatabase].tables[n];if(!t)return err(`relación "${ref}" no existe`);const rows=Object.entries(t.columns).map(([c,def])=>{const{type,notNull}=splitColumnType(def);return[c,type,notNull?"not null":""]});return table(["Column","Type","Nullable"],rows,`Table "public.${n}"`)}
function roles(){return table(["Rol","LOGIN","Superusuario","Membresías"],Object.entries(DB.roles).map(([n,r])=>[n,r.login?"LOGIN":"NOLOGIN",r.superuser?"Sí":"No",(r.members||[]).join(", ")]))}
function backup(n){let d=DB.databases[n];if(!d)return err(`base de datos "${n}" no existe`);let p=need("CONNECT","database",n);if(p)return p;let out=`-- BACKUP DATABASE ${n}\n`;for(let [tn,t] of Object.entries(d.tables)){out+=`CREATE TABLE ${tn} (${Object.entries(t.columns).map(([c,x])=>c+" "+x).join(", ")});\n`;for(let r of t.rows)out+=`INSERT INTO ${tn} (${Object.keys(t.columns).join(", ")}) VALUES (${Object.keys(t.columns).map(c=>"'"+String(r[c]??"").replaceAll("'","''")+"'").join(", ")});\n`}return{type:"info",text:out}}
    </script>

    <!-- ================================================================
         INTERACCIÓN DE LA TERMINAL (antes script.js)
         Conecta la interfaz con el motor de comandos.
         ================================================================ -->
    <script>
const out=document.getElementById("terminalOutput");
const input=document.getElementById("commandInput");
const promptEl=document.getElementById("prompt");
const helpPanel=document.getElementById("helpPanel");
const helpTitle=document.getElementById("helpTitle");
const helpContent=document.getElementById("helpContent");
const elUser=document.getElementById("currentUser");
const elDatabase=document.getElementById("currentDatabase");
const elRole=document.getElementById("currentRole");

/* Historial de comandos (flechas ↑/↓) y lista de palabras clave (Tab). */
let history=[],histIndex=-1;
const KEYWORDS=["\\l","\\list","\\dt","\\d ","\\du","\\c ","\\connect ","\\q","whoami","clear",
"SELECT * FROM ","SELECT version();","SELECT * FROM pg_roles;","CREATE DATABASE ","CREATE TABLE ",
"CREATE ROLE ","CREATE USER ","DROP ROLE ","DROP USER ","GRANT ","REVOKE ","SET ROLE ","RESET ROLE;",
"INSERT INTO ","UPDATE ","DELETE FROM ","BACKUP DATABASE "];

function isSuper(){return !!DB.roles[DB.sessionRole]?.superuser}
function promptText(){return DB.currentDatabase+"="+(isSuper()?"#":">")}

/* Actualiza prompt (RF-02) y barra de estado tras cada comando. */
function updateStatus(){
 promptEl.textContent=promptText();
 elUser.textContent=DB.sessionRole;
 elDatabase.textContent=DB.currentDatabase;
 elRole.textContent=isSuper()?"SUPERUSER":"USER";
}

function printLine(text,cls){
 const div=document.createElement("div");
 div.className="terminal-line "+(cls||"output-normal");
 div.textContent=text;
 out.appendChild(div);
 out.scrollTop=out.scrollHeight;
}

function printTable(t){
 const wrap=document.createElement("div");
 wrap.className="terminal-line";
 if(t.title){
  const titleDiv=document.createElement("div");
  titleDiv.className="output-info";
  titleDiv.style.marginBottom="4px";
  titleDiv.textContent=t.title;
  wrap.appendChild(titleDiv);
 }
 const tableEl=document.createElement("table");
 const trh=document.createElement("tr");
 t.headers.forEach(h=>{const th=document.createElement("th");th.textContent=h;trh.appendChild(th)});
 tableEl.appendChild(trh);
 t.rows.forEach(r=>{
  const tr=document.createElement("tr");
  r.forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td)});
  tableEl.appendChild(tr);
 });
 wrap.appendChild(tableEl);
 out.appendChild(wrap);
 out.scrollTop=out.scrollHeight;
}

/* Mapea el "type" que devuelve executeCommand() a las clases reales del CSS (RF-14). */
const typeClass={success:"output-success",error:"output-error",info:"output-info"};

function runCommand(){
 const s=input.value;
 if(!s.trim())return;
 if(history[history.length-1]!==s.trim())history.push(s.trim());
 histIndex=-1;
 printLine(promptText()+" "+s.trim());
 input.value="";
 input.style.height="auto";
 const r=executeCommand(s);
 if(r){
  if(r.type==="clear")out.innerHTML="";
  else if(r.type==="table")printTable(r);
  else printLine(r.text,typeClass[r.type]);
 }
 updateStatus();
 input.focus();
}

/* Tab: autocompleta contra KEYWORDS. Si hay una sola coincidencia, la completa;
   si hay varias, completa el prefijo común y lista las opciones. */
function autocomplete(){
 const v=input.value;
 if(!v)return;
 const matches=KEYWORDS.filter(k=>k.toLowerCase().startsWith(v.toLowerCase()));
 if(matches.length===1){
  input.value=matches[0];
 }else if(matches.length>1){
  let common=matches[0];
  matches.forEach(m=>{let i=0;while(i<common.length&&i<m.length&&common[i].toLowerCase()===m[i].toLowerCase())i++;common=common.slice(0,i)});
  if(common.length>v.length)input.value=common;
  printLine(matches.join("   "),"output-info");
 }
 input.style.height="auto";input.style.height=input.scrollHeight+"px";
}

function clearTerminal(){out.innerHTML="";input.focus()}

document.getElementById("runButton").onclick=runCommand;
document.getElementById("clearButton").onclick=clearTerminal;
document.getElementById("resetButton").onclick=()=>{
 DB=initialState();
 out.innerHTML="";
 printLine("Sesión reiniciada al estado base.","output-info");
 updateStatus();
 input.focus();
};
document.getElementById("helpButton").onclick=()=>{
 helpTitle.textContent="Ayuda rápida";
 helpContent.innerHTML=HELP;
 helpPanel.classList.remove("hidden");
};
document.getElementById("explainButton").onclick=()=>{
 helpTitle.textContent="Explicaciones";
 helpContent.innerHTML=EXPLAIN;
 helpPanel.classList.remove("hidden");
};
document.getElementById("closeHelp").onclick=()=>helpPanel.classList.add("hidden");

/* Enter ejecuta el comando (RF-03); Shift+Enter permite salto de línea.
   ArrowUp/ArrowDown navegan el historial (solo si el campo no tiene saltos de línea,
   para no romper la edición de comandos multilínea). Tab autocompleta. Ctrl+L limpia. */
input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();runCommand();return}
 if(e.key==="ArrowUp"&&!input.value.includes("\n")){
  if(history.length){
   if(histIndex===-1)histIndex=history.length-1;
   else if(histIndex>0)histIndex--;
   input.value=history[histIndex]||"";
   setTimeout(()=>{input.selectionStart=input.selectionEnd=input.value.length},0);
  }
  e.preventDefault();return;
 }
 if(e.key==="ArrowDown"&&!input.value.includes("\n")){
  if(histIndex!==-1){
   if(histIndex<history.length-1){histIndex++;input.value=history[histIndex]}
   else{histIndex=-1;input.value=""}
   setTimeout(()=>{input.selectionStart=input.selectionEnd=input.value.length},0);
  }
  e.preventDefault();return;
 }
 if(e.key==="Tab"){e.preventDefault();autocomplete();return}
 if(e.key==="l"&&e.ctrlKey){e.preventDefault();clearTerminal();return}
});
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=input.scrollHeight+"px"});

printLine("psql (Emulador Educativo) V2","output-info");
printLine("Usuario inicial: postgres | Base: postgres | Escriba 'whoami' para ver su rol actual.","output-info");
updateStatus();
input.focus();
    </script>
</body>
</html>
